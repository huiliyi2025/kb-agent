<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kb-agent · 企业知识库问答</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel-2: #1e222d; --line: #2a2f3d;
    --text: #e6e8ee; --muted: #8b93a7; --brand: #4f8cff; --brand-2: #6ee7b7;
    --warn: #fbbf24; --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .badge { font-size: 12px; color: var(--muted); border: 1px solid var(--line);
                  border-radius: 999px; padding: 2px 10px; }
  main { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--line); background: var(--panel); padding: 14px;
          overflow-y: auto; }
  section.chat { display: flex; flex-direction: column; min-height: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px;
       color: var(--muted); margin: 14px 0 8px; }
  h2:first-child { margin-top: 0; }
  .row { display: flex; gap: 8px; }
  input[type=text], input[type=password], input[type=file], textarea, select {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font-size: 13px; }
  input:focus { outline: 1px solid var(--brand); }
  button { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 13px;
           white-space: nowrap; }
  button:hover { border-color: var(--brand); }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #docs { list-style: none; margin: 0; padding: 0; }
  #docs li { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
             margin-bottom: 6px; background: var(--panel-2); font-size: 12.5px; }
  #docs .meta { color: var(--muted); font-size: 11.5px; }
  .messages { flex: 1; overflow-y: auto; padding: 22px 26px; }
  .msg { max-width: 820px; margin: 0 auto 18px; }
  .msg .who { font-size: 11.5px; color: var(--muted); margin-bottom: 5px; }
  .bubble { padding: 12px 14px; border-radius: 10px; background: var(--panel-2);
            border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: #1b2439; border-color: #2c3f66; }
  .citations { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .cite { font-size: 12px; color: var(--muted); border-left: 2px solid var(--brand);
          padding: 4px 10px; background: #141822; border-radius: 0 6px 6px 0; }
  .cite { white-space: pre-wrap; }
  .cite b { color: var(--text); font-weight: 600; }
  .meta-line { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .composer { border-top: 1px solid var(--line); padding: 12px 26px 16px; background: var(--panel); }
  .composer .inner { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  .hint { color: var(--muted); font-size: 12px; margin: 0 auto 8px; max-width: 820px; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--muted); margin-right: 6px; }
  .pill.ok { color: var(--brand-2); border-color: #2f5f4c; }
  .pill.warn { color: var(--warn); border-color: #5c4a1f; }
  .err { color: var(--danger); font-size: 12.5px; }
  .hidden { display: none !important; }
@media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } aside { max-height: 42vh; border-bottom: 1px solid var(--line); } section.chat { height: 65vh; } header { flex-wrap: wrap; } .messages { padding: 14px; } .composer { padding: 12px; } } textarea { resize: vertical; min-height: 42px; } .doc-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }</style>
</head>
<body>
<header>
  <h1>kb-agent · 企业知识库问答</h1>
  <span class="badge" id="health">连接中…</span>
  <span class="badge" id="who">未登录</span>
</header>

<main>
  <aside>
    <h2>登录</h2>
    <div id="auth-box">
      <div class="row"><input id="username" type="text" value="admin" placeholder="用户名" /></div>
      <div class="row" style="margin-top:6px"><input id="password" type="password" placeholder="密码" /></div>
      <div class="row" style="margin-top:6px"><button class="primary" id="login-btn" style="width:100%">登录</button></div>
      <div class="row" style="margin-top:6px"><button id="register-btn">注册账号</button><button id="logout-btn" class="hidden">退出登录</button></div><div class="err" id="auth-err" style="margin-top:6px"></div>
    </div>

    <div id="doc-box" class="hidden">
      <h2>会话</h2><div class="row"><select id="sessions" aria-label="历史会话"><option value="">新会话</option></select><button id="new-session-btn">新建</button></div><h2>上传文档</h2>
      <input id="file" type="file" accept=".md,.txt,.docx,.pdf" />
      <div class="row" style="margin-top:6px"><button id="upload-btn" style="width:100%">上传并建索引</button></div>
      <div class="err" id="upload-err" style="margin-top:6px"></div>

      <h2>知识库</h2><p class="hint">勾选文档限定本次问答范围；Agent 检索你的全部文档。</p>
      <ul id="docs"></ul>
    </div>
  </aside>

  <section class="chat">
    <div class="messages" id="messages" aria-live="polite">
      <div class="msg bot">
        <div class="who">kb-agent</div>
        <div class="bubble">你好，登录后我就能基于你上传的文档回答问题，并显示引用来源。引用编号有效不代表答案一定正确，请核对原文。
试试问：「出差住宿费一线城市每晚最多报多少？」</div>
      </div>
    </div>
    <div class="composer">
      <div class="hint">Enter 发送 · Shift+Enter 换行 · 回答带 [n] 编号，可在下方看到对应原文</div>
      <div class="inner">
        <textarea id="question" rows="2" maxlength="500" aria-label="问题" placeholder="输入你的问题…" disabled></textarea>
        <button class="primary" id="send-btn" disabled>提问</button>
        <button id="agent-btn" disabled title="让模型自己决定查几次">Agent</button>
      </div>
    </div>
  </section>
</main>

<script type="module" src="/static/app.js"></script>
</body>
</html>
